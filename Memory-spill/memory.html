<DOCTYPE HTML>
    <html lang="no">
	    <head>
		    <title></title>
			<meta charset="utf-8">
			<link rel="stylesheet" type="text/css" href="" />
			
			<script>
			const cards = document.querySelectorAll('.card');

			let flippedCard = false;
			let firstCard, secondCard;

			function flipCard() {
			  this.classList.add('flip');

				if (!flippedCard) {
				flippedCard = true;
				firstCard = this;
				} 
			  
				else {
				flippedCard = false;
				secondCard = this;

					if (firstCard.dataset.framework === secondCard.dataset.framework) {
				  firstCard.removeEventListener('click', flipCard);
				  secondCard.removeEventListener('click', flipCard);
					}
				
					else {
					setTimeout(() => {
					firstCard.classList.remove('flip');
					secondCard.classList.remove('flip');
					}, 
				  1000);
				}
				}
			  }
			  cards.forEach(card => card.addEventListener('click', flipCard));
			</script>
			
			<style>
			    .game-board {
				  display: flex;
				  flex-wrap: wrap;
				  width: 600px;
				  margin: 0 auto;
				}
				
				.card {
				  position: relative;
				  width: calc(25% - 20px);
				  height: 200px;
				  margin: 10px;
				  perspective: 1000px;
				  cursor: pointer;
				}
				
				.front, .back {
				  position: absolute;
				  width: 100%;
				  height: 100%;
				  backface-visibility: hidden;
				  border-radius: 5px;
				}
				
				.front {
				  background-color: #ccc;
				}
				
				.back {
				  transform: rotateY(180deg);
				  background-color: #333;
				  color: #fff;
				  font-size: 50px;
				  display: flex;
				  justify-content: center;
				  align-items: center;
				}

			</style>
		</head>
		
		<body>
			<div class="game-board">
				<div class="card">
					<div class="front">
					</div>
					<div class="back">
					</div>
				</div>
				<div class="card">
					<div class="front">
					</div>
					<div class="back">
					</div>
				</div>
				<div class="card">
					<div class="front">
					</div>
					<div class="back">
					</div>
				</div>
			<!-- repeat for each card in your game -->
			</div>
    	</body>
	<html>
