			function oppstart() {
				document.getElementById("lstManed").onchange = fyllDato;
				document.getElementById("btnReg").onclick = registrer;
				document.getElementById("lstVis").onchange = sorter;
				document.getElementById("btnSiste").onclick = presenterTilbake;
				document.getElementById("btnNeste").onclick = presenterFrem;
				<!-- lager flere linker til både knapper og listebokser som skal starte forskjellige funksjoner -->
				
				var select = document.getElementById("lstManed");
				var select2 = document.getElementById("lstVis");
				for(var i = 0; i < maned.length; i++) {
					var opt = maned[i];
					var el = document.createElement("option");
					el.innerHTML = maned[i];
					el.value = i;
					select.appendChild(el);
					var elVis = document.createElement("option");
					elVis.innerHTML = maned[i];
					elVis.value = i;
					select2.appendChild(elVis);
				}
				<!-- denne koden fyller listeboksen for måneder med verdier fra maned arrayen. Bruker for løkke og danner elementer som legges til som options i listeboksen -->
			}
			
			function fyllDato() {
				var select = document.getElementById("lstDag");
				var valgtMnd = (document.getElementById("lstManed").selectedIndex)-1;
				for(var i = 0; i <= dato[valgtMnd].length; i++) {
					var opt = i;
					var el = document.createElement("option");
					el.textContent = opt;
					el.value = opt;
					select.appendChild(el);
				}
				<!-- denne koden fyller dato listeboksen i henhold til valgt måned -->
			}
			
			function registrer() {
				var tall = document.getElementById("numGrad").value;
				var maned = (document.getElementById("lstManed").selectedIndex)-1;
				var dag = (document.getElementById("lstDag").selectedIndex)-1;
				dato[maned][dag] = parseFloat(tall);
				<!-- etablerer flere variabler som verdien av input tall og den valgte indeksen i måneden og dag listeboksen -->
			
				document.getElementById("numGrad").value = 0;
				document.getElementById("lstManed").selectedIndex = 0;
				document.getElementById("lstDag").selectedIndex = 0;
				<!-- denne koden nullstiller inputboksen og listeboksene -->
				
			}
			
			function sorter() {
			<!-- etablerer tre variabler, minus, pluss og maned med verdien av den valgte indeksen -->
			var minus = 0;
			var pluss = 0;
			var valgtMnd = (document.getElementById("lstVis").selectedIndex)-1;
			var tall = dato[valgtMnd];
			<!-- etablerer variabel tall som snarvei for dato[valgtmnd] -->
			
			for(var i = 0; i < tall.length; i++) {
				if(tall[i] < 0) {
					minus++;
				}
			}
			<!-- en forløkke som finner minus tallene ved å søke gjennom arrayen. Dersom indekstallet er mindre enn 0 legges det til minus -->
			for(var j = 0; j < tall.length; j++) {
				if(tall[j] > 0) {
					pluss++;
				}
			}
			<!-- en forløkke som finner pluss tallene ved å søke gjennom arrayen. Dersom indekstallet er større enn 0 legges det til pluss -->
			
			var stor = tall[0];
			<!-- etablerer en variabel kalt stor som har samme verdi som er første verdi i arrayen tall -->
            var dag = 0;
			<!-- etablerer em variabel kalt tall som er lik 0 som skal være dato-->
			
			for(var k = 0; k < tall.length; k++) {
				if(tall[k] > stor){  
				   stor = tall[k];
				   dag = k + 1;
				}
			}
			<!-- lager en for løke som leter gjennom arrayen dato. dersom indekstallet er større en variabelen stor, blir så varibelene stor lik indekstallet. Datoen blir så indekstallet pluss 1 fordi arrayen starter i nulte posisjon ikke første -->
			document.getElementById("txtVis").innerHTML = "Dager med kuldegrader: " + minus + "<br />" + "Dager med varmegrader: " + pluss + "<br />" + "Den varmeste dagen var den " + dag + ", da var det " + stor + " grader";
			visDiagram(valgtMnd);
			<!-- funskjonskall for visning av diagram -->
			}
			
			function visDiagram(valgtMnd) {
				var nyDiaTemp = 0;
                var soyle = "";
                var nullSoyle = "";
				
				for(var j = 0; j < 31; j++) {
					soyle = "tempP" + j;
					nullSoyle = "tempM" + j;
					document.getElementById(nullSoyle).style.height = "0px";
					document.getElementById(soyle).style.height = "0px";
				}
               
                //Solye og null soyle er åpne fordi det skal kunne være mulig å legge til selv mens den nye tempen alltid skal starte med 0
                for(var i = 0; i < dato[valgtMnd].length; i++) {
                    nyDiaTemp = dato[valgtMnd][i];
                    if(nyDiaTemp > 0) {
                        soyle = "tempP" + i;
                        nullSoyle = "tempM" + i;
                        document.getElementById(soyle).style.height = (nyDiaTemp * 20) + "px";
                        document.getElementById(nullSoyle).style.height = "0px";
                    }
                // Her etablerer vi søylen til den valgte måneden som blir lagt til og ut i fra den så skal søylen som er pluss grader øke med det anntallet som er valgt ut i fra valgt temp og måned, den skal da gi t resultat i pixler på søyle diagrammet valgt ut i fra stilen
                    else if(nyDiaTemp < 0) {
                        nyDiaTemp = Math.abs(nyDiaTemp);
                        soyle = "tempM" + i;
                        nullSoyle = "tempP" + i;
                        document.getElementById(soyle).style.height = (nyDiaTemp * 20) + "px";
                        document.getElementById(nullSoyle).style.height = "0px";
                //Vis temperaturen ikke er pluss for den måneden er minus så vil den temp M(minus) etablere et diagram med piksler hvor da søylediagrammet vil gå nedover
                    }   
                }
            }
			
			function presenterFrem() {
			if (h < 7) {
				h++;
				document.getElementById("lysbilde").src = arrBilder[h];
			}
			else {
				h = 0;
				document.getElementById("lysbilde").src = arrBilder[h];
			}
			}
			
			function presenterTilbake() {
			if (h < 7) {
				h--;
				document.getElementById("lysbilde").src = arrBilder[h];
			}
			else {
				h = 7;
				document.getElementById("lysbilde").src = arrBilder[h];
			}
			}
